<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <h1>Blackjack!</h1>
          <p>Six-deck shoe • 3:2 blackjack • Dealer stands on soft 17</p>
        </div>
        <div class="stats">
          <div class="stat-box">
            <span class="label">Bankroll</span>
            <strong id="bankroll">$1000</strong>
          </div>
          <div class="stat-box">
            <span class="label">Current bet</span>
            <strong id="bet">$25</strong>
          </div>
          <div class="stat-box">
            <span class="label">Shoe</span>
            <strong id="shoe-count">312</strong>
          </div>
        </div>
      </section>

      <section class="controls">
        <label class="bet-control" for="bet-input">
          Bet
          <input id="bet-input" type="number" min="5" step="5" value="25" />
        </label>
        <button id="deal-btn">Deal hand</button>
        <button id="reset-btn">Reset bankroll</button>
      </section>

      <section class="table">
        <div class="dealer-area">
          <h2>Dealer</h2>
          <div id="dealer-cards" class="card-row"></div>
          <div id="dealer-total" class="hand-total"></div>
        </div>

        <div class="player-area">
          <h2>Player</h2>
          <div id="player-hands" class="hand-list"></div>
        </div>
      </section>

      <section class="action-bar">
        <button id="hit-btn">Hit</button>
        <button id="stand-btn">Stand</button>
        <button id="double-btn">Double</button>
        <button id="split-btn">Split</button>
      </section>

      <section class="message-area">
        <p id="message">Place a bet and deal a fresh hand.</p>
      </section>

      <div id="insurance-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="insurance-title">
        <div class="modal-card">
          <h3 id="insurance-title">Buy insurance?</h3>
          <p id="insurance-modal-message">The dealer shows an Ace. Insurance costs half your original bet and pays 2:1 if the dealer has blackjack.</p>
          <div class="modal-actions">
            <button id="insurance-btn">Buy insurance</button>
            <button id="decline-insurance-btn" class="secondary">Decline</button>
          </div>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
